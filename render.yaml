# Render Blueprint — deploy both services with one click
# https://render.com/docs/blueprint-spec
#
# Usage:
#   1. Push this file to GitHub
#   2. Go to https://dashboard.render.com/blueprints
#   3. Click "New Blueprint Instance" and select your repo
#   4. Fill in the environment variable values when prompted
#   5. Click "Apply" — Render creates both services automatically

services:
  # ── Backend API ──────────────────────────────────────
  - type: web
    name: inventory-api
    runtime: node
    region: singapore  # closest to Vietnam
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: node src/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false  # prompts you to enter the value during setup
      - key: CLIENT_URL
        fromService:
          name: inventory-client
          type: web
          property: host
          # Render will auto-fill the frontend URL

  # ── Frontend Static Site ─────────────────────────────
  - type: web
    name: inventory-client
    runtime: static
    region: singapore
    plan: free
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false  # enter your backend URL + /api  (e.g. https://inventory-api-xxxx.onrender.com/api)
